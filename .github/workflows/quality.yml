name: Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate theme source
        run: npm run check

      - name: Verify required Twilight views
        run: |
          test -s src/views/pages/product/single.twig
          test -s src/views/pages/product/index.twig
          test -s src/views/pages/cart.twig
          test -s src/assets/js/main.js
