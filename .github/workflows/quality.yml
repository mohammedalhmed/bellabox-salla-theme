name: Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('twilight.json','utf8'))"

      - name: Check JavaScript syntax
        run: |
          find src/assets/js -type f -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Verify required Twilight views
        run: |
          test -s src/views/pages/product/single.twig
          test -s src/views/pages/product/index.twig
          test -s src/views/pages/cart.twig
          test -s src/assets/js/main.js
